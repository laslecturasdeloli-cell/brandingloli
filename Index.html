<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loli's Branding Suite</title>
  
  <!-- CDNs de React, Tailwind y HTML-to-Image -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  
  <!-- Fuentes Premium de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:ital,wght@1,400&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    .font-sans { font-family: 'Montserrat', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- ICONOS SVG LIVIANOS (Para evitar importar librerías pesadas) ---
    const StarIcon = ({ size = 20, fill = "none", className = "", style = {} }) => (
      <svg className={className} style={style} width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
    );

    const FeatherIcon = ({ size = 20, style = {} }) => (
      <svg style={style} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" />
        <line x1="16" y1="8" x2="2" y2="22" />
        <line x1="17.5" y1="15" x2="9" y2="15" />
      </svg>
    );

    const BookIcon = ({ size = 20, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
    );

    const QuoteIcon = ({ size = 20, className = "", style = {} }) => (
      <svg className={className} style={style} width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <path d="M14.017 21v-7.391c0-5.704 3.748-9.762 9-10.91l.937 1.865c-3.716 1.108-5.937 3.921-5.937 7.54h5.937V21h-9.937zm-14 0v-7.391c0-5.704 3.748-9.762 9-10.91l.938 1.865c-3.717 1.108-5.937 3.921-5.937 7.54h5.938V21H.017z" />
      </svg>
    );

    const UploadIcon = ({ size = 20, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
    );

    const XIcon = ({ size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    const TrashIcon = ({ size = 16, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </svg>
    );

    const PaletteIcon = ({ size = 14, className = "" }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.01445 19.1559 5.09238 19.3789 5.06418 19.598C5.00412 20.0651 4.9729 20.5367 4.9729 21C4.9729 21.5523 5.42061 22 5.9729 22H12Z" />
      </svg>
    );

    const EyeIcon = ({ size = 20, style = {} }) => (
      <svg style={style} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    );

    const App = () => {
      // --- ESTADOS GLOBALES ---
      const [activeTab, setActiveTab] = useState('stories'); 
      const [format, setFormat] = useState('portrait'); 
      const [isDownloading, setIsDownloading] = useState(false);
      const [previewImage, setPreviewImage] = useState(null); 
      const canvasRef = useRef(null);

      // --- CONFIGURACIÓN DE BRANDING ---
      const [brandingColors, setBrandingColors] = useState({
        background: '#0B132B', text: '#F4F1DE', accent: '#C29B40'
      });

      // --- ESTADOS DE CONTENIDO ---
      const [title, setTitle] = useState("Lecturas del Mes");
      const [author, setAuthor] = useState("Nombre del Autor");
      const [subtitle, setSubtitle] = useState("@laslecturasdeloli");
      const [quoteText, setQuoteText] = useState("Escribe aquí una cita corta...");
      const [rating, setRating] = useState(5);
      const [pagesRead, setPagesRead] = useState("Página 124 de 350");
      const [listItems, setListItems] = useState(["Libro 1", "Libro 2", "Libro 3"]);
      
      // --- ESTADO WRAP UP (9 LIBROS) ---
      const [wrapUpItems, setWrapUpItems] = useState(
        Array(9).fill(null).map(() => ({ cover: null, rating: 5 }))
      );
      const [wrapUpBg, setWrapUpBg] = useState(null);

      // --- ESTADOS DE IMÁGENES ---
      const [bookCover, setBookCover] = useState(null);
      const bookCoverInputRef = useRef(null);
      const wrapBgInputRef = useRef(null);
      const wrapItemInputRefs = useRef([]);

      // Función para comprimir fotos en el celular antes de procesar
      const resizeImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;

              const MAX_WIDTH = 800;
              const MAX_HEIGHT = 1000;

              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const handleImage = async (e, type, index = null) => {
        const file = e.target.files[0];
        if (file) {
          const optimizedBase64 = await resizeImage(file);
          if (type === 'main') setBookCover(optimizedBase64);
          if (type === 'wrapBg') setWrapUpBg(optimizedBase64);
          if (type === 'wrapItem') {
            const newItems = [...wrapUpItems];
            newItems[index].cover = optimizedBase64;
            setWrapUpItems(newItems);
          }
        }
      };

      const updateWrapRating = (index, newRating) => {
        const newItems = [...wrapUpItems];
        newItems[index].rating = newRating;
        setWrapUpItems(newItems);
      };

      const addListItem = () => setListItems([...listItems, ""]);
      const removeListItem = (index) => setListItems(listItems.filter((_, i) => i !== index));
      const updateListItem = (index, value) => {
        const newList = [...listItems];
        newList[index] = value;
        setListItems(newList);
      };

      const generateImage = async () => {
        if (!window.htmlToImage) return;
        setIsDownloading(true);
        
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        const config = {
          quality: 0.92, 
          pixelRatio: isMobile ? 2 : 2.5, // Subimos a 2 porque el nuevo formato de fondo es ultra liviano
          backgroundColor: brandingColors.background,
          style: {
            transform: 'scale(1)',
            webkitTransform: 'scale(1)'
          }
        };

        try {
          // Esperamos a que el sistema procese el renderizado
          await new Promise(resolve => setTimeout(resolve, 400));
          const dataUrl = await window.htmlToImage.toJpeg(canvasRef.current, config);
          setPreviewImage(dataUrl);
        } catch (err) { 
          console.error(err);
          alert("Hubo un error al generar la imagen. Intenta con una portada más pequeña.");
        } finally { 
          setIsDownloading(false); 
        }
      };

      return (
        <div className="min-h-screen bg-slate-200 flex flex-col md:flex-row font-sans overflow-hidden">
          
          {/* MODAL DE VISTA PREVIA (Para iOS) */}
          {previewImage && (
            <div className="fixed inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center p-4">
              <div className="bg-white p-1 rounded-lg mb-6 shadow-2xl max-w-full overflow-hidden">
                <img src={previewImage} className="max-h-[75vh] object-contain" alt="Resultado Final" />
              </div>
              <div className="text-center space-y-4 max-w-xs">
                <p className="text-white font-bold text-sm italic">
                  ¡Diseño listo! Mantén presionada la imagen de arriba y elige <span className="text-[#C29B40]">"Guardar en Fotos"</span>.
                </p>
                <button 
                  onClick={() => setPreviewImage(null)}
                  className="w-full py-4 bg-[#C29B40] text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg"
                  style={{ backgroundColor: brandingColors.accent }}
                >
                  <XIcon size={20} /> Volver al Editor
                </button>
              </div>
            </div>
          )}

          {/* BARRA LATERAL (NAVEGACIÓN) */}
          <div className="w-full md:w-72 bg-[#0B132B] text-white p-6 flex flex-col gap-6 shadow-2xl z-20 overflow-y-auto" style={{ backgroundColor: brandingColors.background }}>
            <div className="flex items-center gap-3 border-b border-white/10 pb-6">
              <div className="p-2 rounded-xl text-[#0B132B]" style={{ backgroundColor: brandingColors.accent }}>
                <FeatherIcon size={28} />
              </div>
              <div>
                <h1 className="font-bold tracking-tight text-xl leading-tight" style={{ color: brandingColors.text }}>Loli's Suite</h1>
                <p className="text-[10px] uppercase tracking-[0.2em] opacity-60" style={{ color: brandingColors.accent }}>Vercel Stable</p>
              </div>
            </div>

            <nav className="flex flex-col gap-2">
              {[
                { id: 'stories', label: 'Reseñas' },
                { id: 'quotes', label: 'Citas' },
                { id: 'lists', label: 'Listas' },
                { id: 'wrapup', label: 'Wrap Up' },
                { id: 'reels', label: 'Marcos Reels' }
              ].map(tab => (
                <button 
                  key={tab.id}
                  onClick={() => {setActiveTab(tab.id); if(tab.id==='wrapup'||tab.id==='reels') setFormat('portrait');}}
                  className={`flex items-center gap-3 p-3.5 rounded-2xl transition-all text-left ${activeTab === tab.id ? 'font-bold shadow-lg scale-[1.02]' : 'hover:bg-white/5 opacity-60'}`}
                  style={activeTab === tab.id ? { backgroundColor: brandingColors.accent, color: brandingColors.background } : { color: brandingColors.text }}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </div>

          {/* ÁREA CENTRAL (EDITOR + PREVIEW) */}
          <div className="flex-grow p-4 md:p-8 flex flex-col lg:flex-row gap-8 items-center lg:items-start justify-start lg:justify-center overflow-y-auto bg-slate-100 h-screen">
            
            {/* PANEL DE CONTROL */}
            <div className="w-full max-w-md bg-white rounded-[2rem] shadow-xl p-6 space-y-6 flex-shrink-0">
              
              {/* CONFIGURACIÓN DE COLORES */}
              <div className="bg-slate-50 p-4 rounded-2xl space-y-3 border border-slate-100">
                <h3 className="text-[10px] font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
                  <PaletteIcon size={14} /> Colores Personalizados
                </h3>
                <div className="grid grid-cols-3 gap-2">
                  {['background', 'text', 'accent'].map(key => (
                    <div key={key} className="flex flex-col items-center gap-1">
                      <input 
                        type="color" 
                        value={brandingColors[key]} 
                        onChange={(e) => setBrandingColors({...brandingColors, [key]: e.target.value})} 
                        className="w-full h-8 rounded-lg cursor-pointer border-none shadow-sm" 
                      />
                      <span className="text-[8px] font-bold text-slate-500 uppercase">{key}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="space-y-4">
                <div className="space-y-2">
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Formato</label>
                  <div className="flex bg-slate-100 p-1 rounded-xl">
                    <button onClick={() => setFormat('portrait')} className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold transition-all ${format === 'portrait' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-400'}`}>
                      9:16
                    </button>
                    {(activeTab !== 'wrapup' && activeTab !== 'reels') && (
                      <button onClick={() => setFormat('square')} className={`flex-1 flex items-center justify-center gap-2 py-2 rounded-lg text-xs font-bold transition-all ${format === 'square' ? 'bg-white shadow-sm text-slate-800' : 'text-slate-400'}`}>
                        1:1
                      </button>
                    )}
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Información</label>
                  <input type="text" value={subtitle} onChange={(e) => setSubtitle(e.target.value)} placeholder="Subtítulo (@laslecturasdeloli)" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none" />
                  <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título Principal" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm font-bold outline-none" />
                  
                  {activeTab === 'stories' && (
                    <>
                      <input type="text" value={author} onChange={(e) => setAuthor(e.target.value)} placeholder="Autor" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm outline-none" />
                      <div className="py-1 flex items-center justify-between">
                        <label className="text-[10px] uppercase font-bold text-slate-400">Puntuación</label>
                        <div className="flex gap-1">
                          {[1, 2, 3, 4, 5].map((num) => (
                            <button key={num} onClick={() => setRating(num)} style={{ color: rating >= num ? brandingColors.accent : '#e2e8f0' }}>
                              <StarIcon size={22} fill={rating >= num ? brandingColors.accent : "none"} />
                            </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  {(activeTab === 'stories' || activeTab === 'quotes') && (
                    <textarea 
                      value={quoteText} 
                      onChange={(e) => setQuoteText(e.target.value)} 
                      className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm h-20 resize-none outline-none" 
                      placeholder={activeTab === 'stories' ? "Escribe una cita corta..." : "Escribe la cita del libro..."}
                    />
                  )}

                  {activeTab === 'quotes' && <input type="text" value={pagesRead} onChange={(e) => setPagesRead(e.target.value)} placeholder="Ej: Página 140 de 300" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm" />}

                  {activeTab === 'lists' && (
                    <div className="space-y-2">
                      <label className="text-[10px] uppercase font-bold text-slate-400">Ítems de Lista</label>
                      {listItems.map((item, index) => (
                        <div key={index} className="flex gap-2 items-center">
                          <input type="text" value={item} onChange={(e) => updateListItem(index, e.target.value)} className="flex-grow p-2 bg-slate-50 border border-slate-100 rounded-lg text-sm" placeholder={`Ítem ${index + 1}`} />
                          <button onClick={() => removeListItem(index)} className="text-red-400 hover:bg-red-50 p-1 rounded-lg"><TrashIcon size={16} /></button>
                        </div>
                      ))}
                      <button onClick={addListItem} className="w-full py-2 border-2 border-dashed rounded-xl text-[10px] font-bold flex items-center justify-center gap-2 transition-all hover:bg-slate-50" style={{ borderColor: `${brandingColors.accent}4D`, color: brandingColors.accent }}>
                        + Añadir Ítem
                      </button>
                    </div>
                  )}

                  {activeTab === 'wrapup' && (
                    <div className="space-y-4">
                      <div className="p-4 border rounded-2xl flex flex-col items-center gap-2" style={{ backgroundColor: `${brandingColors.accent}11`, borderColor: `${brandingColors.accent}33` }}>
                        <label className="text-[9px] font-bold uppercase tracking-widest" style={{ color: brandingColors.accent }}>Fondo Wrap Up</label>
                        <button onClick={() => wrapBgInputRef.current.click()} className="text-[10px] font-bold bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-100 flex items-center gap-2">
                          <PaletteIcon size={14} style={{ color: brandingColors.accent }} /> {wrapUpBg ? "Cambiar" : "Subir Foto"}
                        </button>
                        <input type="file" ref={wrapBgInputRef} className="hidden" onChange={(e) => handleImage(e, 'wrapBg')} accept="image/*" />
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        {wrapUpItems.map((item, idx) => (
                          <div key={idx} className="flex flex-col gap-1">
                            <div 
                              onClick={() => wrapItemInputRefs.current[idx].click()}
                              className="aspect-[3/4] bg-slate-50 border border-slate-100 rounded-lg flex items-center justify-center cursor-pointer overflow-hidden relative"
                            >
                              {item.cover ? (
                                <div className="w-full h-full" style={{ backgroundImage: `url(${item.cover})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                              ) : (
                                <BookIcon size={14} className="text-slate-200" />
                              )}
                              <input type="file" ref={el => wrapItemInputRefs.current[idx] = el} className="hidden" onChange={(e) => handleImage(e, 'wrapItem', idx)} accept="image/*" />
                            </div>
                            <select 
                              value={item.rating} 
                              onChange={(e) => updateWrapRating(idx, parseInt(e.target.value))}
                              className="text-[9px] p-1 bg-slate-50 border-none rounded-md outline-none"
                            >
                              {[1,2,3,4,5].map(n => <option key={n} value={n}>{n} ★</option>)}
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Selector de Portada principal */}
                {(activeTab === 'stories' || activeTab === 'quotes') && (
                  <div className="pt-2">
                    <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-2">Portada Principal</label>
                    <div onClick={() => bookCoverInputRef.current.click()} className="cursor-pointer p-8 border-2 border-dashed rounded-[2rem] text-center transition-all border-slate-200 text-slate-400 hover:bg-slate-50">
                      {bookCover ? <span className="font-bold text-xs flex items-center justify-center gap-2 italic" style={{ color: brandingColors.accent }}><BookIcon size={18}/> Portada Cargada</span> : <><UploadIcon size={24} className="mx-auto mb-2 opacity-30" /><span className="text-[10px] font-bold uppercase tracking-widest">Tocar para Subir</span></>}
                      <input type="file" ref={bookCoverInputRef} className="hidden" onChange={(e) => handleImage(e, 'main')} accept="image/*" />
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* VISTA PREVIA (CANVAS) */}
            <div className="flex flex-col items-center gap-6 flex-shrink-0">
              <div className="text-[9px] font-bold text-slate-400 uppercase tracking-[0.4em]">Preview en Tiempo Real</div>
              <div 
                ref={canvasRef}
                className={`relative shadow-[0_20px_50px_rgba(0,0,0,0.3)] overflow-hidden flex flex-col items-center text-center transition-all duration-500
                  ${format === 'square' ? 'w-[450px] h-[450px] justify-center p-8' : 'w-[320px] h-[568px] justify-between p-8'}`}
                style={{ backgroundColor: brandingColors.background, color: brandingColors.text }}
              >
                {/* Fondo decorativo opcional para Wrap Up con corrección de WebKit */}
                {activeTab === 'wrapup' && wrapUpBg && (
                  <div className="absolute inset-0 z-0">
                    <div className="w-full h-full opacity-20" style={{ backgroundImage: `url(${wrapUpBg})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                    <div className="absolute inset-0" style={{ background: `linear-gradient(to bottom, ${brandingColors.background}CC, ${brandingColors.background})` }}></div>
                  </div>
                )}
                
                <div className="absolute inset-4 border z-10 pointer-events-none" style={{ borderColor: `${brandingColors.accent}26` }}></div>

                {/* HEADER */}
                <div className={`relative z-10 w-full ${format === 'square' ? 'mb-4' : 'mt-2'}`}>
                  <div className="flex items-center justify-center gap-2 mb-2">
                    <div className="h-[1px] w-6 opacity-30" style={{ backgroundColor: brandingColors.accent }}></div>
                    <span className="text-[9px] tracking-[0.4em] uppercase font-bold" style={{ color: brandingColors.accent }}>{subtitle}</span>
                    <div className="h-[1px] w-6 opacity-30" style={{ backgroundColor: brandingColors.accent }}></div>
                  </div>
                  <h2 className={`${format === 'square' ? 'text-xl' : 'text-2xl'} font-bold tracking-tight px-4 leading-tight`} style={{ fontFamily: 'Cinzel, serif' }}>{title}</h2>
                  {activeTab === 'stories' && <p className="text-[11px] italic opacity-70 mt-1 font-serif">{author}</p>}
                </div>

                {/* CONTENIDO CENTRAL */}
                <div className={`relative z-10 w-full flex flex-col items-center justify-center ${format === 'square' ? 'flex-grow-0 py-4' : 'flex-grow py-6'}`}>
                  
                  {activeTab === 'stories' && (
                    <div className="space-y-4 flex flex-col items-center">
                      <div className={`${format === 'square' ? 'w-24 h-36' : 'w-28 h-40'} border shadow-2xl overflow-hidden bg-slate-900 rounded-sm relative`} style={{ borderColor: `${brandingColors.accent}4D` }}>
                        {bookCover ? (
                          <div className="w-full h-full animate-fade-in" style={{ backgroundImage: `url(${bookCover})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                        ) : (
                          <BookIcon size={32} className="absolute inset-0 m-auto opacity-10" />
                        )}
                      </div>
                      <div className="flex justify-center gap-1">
                        {[...Array(5)].map((_, i) => (
                          <StarIcon key={i} size={format === 'square' ? 14 : 16} fill={i < rating ? brandingColors.accent : "none"} style={{ color: i < rating ? brandingColors.accent : brandingColors.text }} className={i < rating ? "" : "opacity-10"} />
                        ))}
                      </div>
                      {quoteText && <div className="px-8 max-w-[280px] relative"><QuoteIcon size={14} className="absolute -top-3 left-2 opacity-20" style={{ color: brandingColors.accent }} /><p className="text-[12px] italic opacity-90 leading-relaxed font-serif">"{quoteText}"</p></div>}
                    </div>
                  )}

                  {activeTab === 'quotes' && (
                    <div className="space-y-6 flex flex-col items-center">
                      <div className="px-8 relative"><QuoteIcon size={24} className="absolute -top-6 left-2 opacity-10" style={{ color: brandingColors.accent }} /><p className={`${format === 'square' ? 'text-lg' : 'text-xl'} leading-relaxed italic font-serif`}>"{quoteText}"</p></div>
                      <div className="flex flex-col items-center gap-2">
                        <span className="text-[9px] tracking-[0.3em] font-bold uppercase" style={{ color: brandingColors.accent }}>Actualmente Leyendo</span>
                        <div className="w-16 h-24 border shadow-xl bg-slate-900 rounded-sm overflow-hidden" style={{ borderColor: `${brandingColors.accent}4D` }}>
                          {bookCover && (
                            <div className="w-full h-full" style={{ backgroundImage: `url(${bookCover})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                          )}
                        </div>
                        <p className="text-[9px] tracking-widest opacity-60 font-sans italic uppercase">{pagesRead}</p>
                      </div>
                    </div>
                  )}

                  {activeTab === 'lists' && (
                    <div className="w-full px-6 space-y-3">
                      {listItems.map((item, i) => (
                        <div key={i} className="flex items-center gap-3">
                          <span className="font-bold text-lg" style={{ fontFamily: 'Cinzel, serif', color: brandingColors.accent }}>0{i+1}.</span>
                          <div className="h-[1px] flex-grow opacity-30" style={{ background: `linear-gradient(to right, ${brandingColors.accent}, transparent)` }}></div>
                          <span className="text-md font-light italic" style={{ fontFamily: 'Playfair Display, serif' }}>{item}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'wrapup' && (
                    <div className="grid grid-cols-3 gap-x-3 gap-y-4 w-full px-2">
                      {wrapUpItems.map((item, i) => (
                        <div key={i} className="flex flex-col items-center gap-1">
                          <div className="aspect-[3/4] w-full border shadow-lg overflow-hidden bg-slate-900/50 rounded-sm" style={{ borderColor: `${brandingColors.accent}4D` }}>
                            {item.cover && (
                              <div className="w-full h-full" style={{ backgroundImage: `url(${item.cover})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>
                            )}
                          </div>
                          <div className="flex gap-[1px]">
                            {[...Array(5)].map((_, s) => (
                              <StarIcon key={s} size={6} fill={s < item.rating ? brandingColors.accent : "none"} style={{ color: s < item.rating ? brandingColors.accent : brandingColors.text }} className={s < item.rating ? "" : "opacity-10"} />
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'reels' && (
                    <div className="w-full h-full flex flex-col items-center justify-center border border-dashed rounded-[2rem] p-6" style={{ borderColor: `${brandingColors.accent}26`, backgroundColor: `${brandingColors.background}44` }}>
                      <p className="text-[9px] uppercase tracking-[0.3em] opacity-30">Contenido del Reel</p>
                    </div>
                  )}
                </div>

                {/* FOOTER */}
                <div className="relative z-10 w-full mt-2">
                  <div className="flex items-center justify-center gap-2 text-[10px] tracking-widest uppercase opacity-40 font-sans">
                    <FeatherIcon size={12} style={{ color: brandingColors.accent }} />
                    <span>@laslecturasdeloli</span>
                  </div>
                </div>
              </div>
              
              <button 
                onClick={generateImage} 
                disabled={isDownloading} 
                className="w-full max-w-[320px] py-4 bg-white text-[#0B132B] rounded-2xl font-bold flex items-center justify-center gap-3 hover:opacity-90 transition-all shadow-xl active:scale-95 disabled:opacity-50 border border-slate-200"
              >
                {isDownloading ? <span className="animate-spin text-[#C29B40]">⌛</span> : <EyeIcon size={20} style={{ color: brandingColors.accent }} />} 
                <span className="uppercase tracking-widest text-xs">Generar Imagen</span>
              </button>
            </div>
          </div>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
